spring:
  application:
    name: ledger

  datasource:
    url: jdbc:h2:mem:ledgerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      # Sized comfortably above the 10-concurrent-request race test: while
      # one request holds the wallet row lock, the other 9 sit blocked
      # inside "SELECT ... FOR UPDATE" *while still holding their own
      # connection*. A default pool of 10 can starve under that pattern,
      # so we give a bit of headroom.
      maximum-pool-size: 25

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
